[pytest]
# Pytest configuration for ChildGrowth Insights

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output settings
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Coverage settings (when using pytest-cov)
# Run with: pytest --cov=. --cov-report=html --cov-report=term-missing

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require mocks)
    slow: Slow running tests
    auth: Authentication related tests
    database: Database related tests
    ai: AI/Gemini integration tests

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum version
minversion = 7.0

# Parallel execution settings (for pytest-xdist)
# Run with: pytest -n auto
